# Supabase 깨우기 (사양서 11장): 무료 프로젝트는 1주일 동안 활동이 없으면 일시정지된다.
# 3일마다 anon 키로 ping() 함수를 부른다. Actions 탭에서 "Run workflow"로 바로 실행할 수도 있다.
# 공개 저장소는 60일 동안 저장소 활동이 없으면 GitHub가 예약 실행을 끈다. 꺼지면 Actions 탭에서 다시 켠다.
name: Supabase 깨우기

on:
  schedule:
    # 매월 1, 4, 7, …일 03:17 UTC (12:17 KST)
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: ping() 호출
    runs-on: ubuntu-latest
    steps:
      - name: ping
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY 변수가 아직 없어 건너뜁니다."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
          echo
