# 네이버 API 확인 (일회용 점검): 넣은 키로 "만항재" 장소 검색(API HUB 지역 검색)과 자동차 길찾기(Maps Directions 5)가 되는지 본다.
# 키 값은 출력하지 않는다. 사용자 위치 없음 (공개된 곳: 만항재, 서울역 → 남산).
name: 네이버 API 확인

on:
  push:
    branches: [kakao-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 장소 검색 · 길찾기
        env:
          SID: ${{ secrets.NAVER_CLIENT_ID }}
          SSEC: ${{ secrets.NAVER_CLIENT_SECRET }}
          MID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          MSEC: ${{ secrets.NCP_MAP_CLIENT_SECRET }}
        run: |
          set +e
          t() { printf '%s' "$1" | tr -d '[:space:]'; }
          SID=$(t "$SID"); SSEC=$(t "$SSEC"); MID=$(t "$MID"); MSEC=$(t "$MSEC")
          for n in SID SSEC MID MSEC; do v=${!n}; echo "$n 길이 ${#v}"; done
          Q=$(node -e 'process.stdout.write(encodeURIComponent("만항재"))')
          cat > /tmp/local.js <<'JS'
          let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const j=JSON.parse(s);
            if(!Array.isArray(j.items)){console.log("  본문", JSON.stringify(j).slice(0,300));return;}
            console.log("  결과", j.items.length, "개 (total", j.total, ")");
            for(const it of j.items) console.log("   -", String(it.title).replace(/<[^>]+>/g,""), "|", it.category, "|", it.roadAddress||it.address, "| mapx", it.mapx, "mapy", it.mapy);
          }catch(e){console.log("  본문을 읽지 못함", s.slice(0,300))}})
          JS
          cat > /tmp/dir.js <<'JS'
          let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const j=JSON.parse(s);
            console.log("  code", j.code, j.message, "· 열쇠", Object.keys(j).join(","));
            const r=j.route&&Object.values(j.route)[0]&&Object.values(j.route)[0][0];
            if(!r){console.log("  본문", JSON.stringify(j).slice(0,300));return;}
            console.log("  경로 종류", Object.keys(j.route).join(","), "· 거리", r.summary.distance, "m · 시간", r.summary.duration, "ms · 점", r.path.length, "· 첫 점이 [경도,위도]?", r.path[0][0]>120);
            console.log("  summary 열쇠", Object.keys(r.summary).join(","), "· route 열쇠", Object.keys(r).join(","));
          }catch(e){console.log("  본문을 읽지 못함", s.slice(0,300))}})
          JS
          echo "▶ 장소 검색 (API HUB)"
          d=$(curl -s -m 15 -w '\n%{http_code}' -H "X-NCP-APIGW-API-KEY-ID: $SID" -H "X-NCP-APIGW-API-KEY: $SSEC" "https://naverapihub.apigw.ntruss.com/search/v1/local?query=$Q&display=5"); echo "  HTTP $(printf '%s' "$d" | tail -1)"; printf '%s' "$d" | sed '$d' | node /tmp/local.js
          echo "▶ 장소 검색 (예전 개발자센터 주소, 참고)"
          d=$(curl -s -m 15 -w '\n%{http_code}' -H "X-Naver-Client-Id: $SID" -H "X-Naver-Client-Secret: $SSEC" "https://openapi.naver.com/v1/search/local.json?query=$Q&display=5"); echo "  HTTP $(printf '%s' "$d" | tail -1)"; printf '%s' "$d" | sed '$d' | node /tmp/local.js
          dir() { echo "▶ 길찾기 $1$2"; d=$(curl -s -m 15 -w '\n%{http_code}' -H "X-NCP-APIGW-API-KEY-ID: $MID" -H "X-NCP-APIGW-API-KEY: $MSEC" "$1$2/v1/driving?start=126.9707,37.5547&goal=126.9882,37.5512"); echo "  HTTP $(printf '%s' "$d" | tail -1)"; printf '%s' "$d" | sed '$d' | node /tmp/dir.js; }
          for host in https://maps.apigw.ntruss.com https://naveropenapi.apigw.ntruss.com; do
            for p in /map-direction /map-direction-15; do dir "$host" "$p"; done
          done
          echo "▶ 주소 찾기(Geocoding) 확인용"
          d=$(curl -s -m 15 -w '\n%{http_code}' -H "X-NCP-APIGW-API-KEY-ID: $MID" -H "X-NCP-APIGW-API-KEY: $MSEC" "https://maps.apigw.ntruss.com/map-geocode/v2/geocode?query=$(node -e 'process.stdout.write(encodeURIComponent("서울특별시 중구 한강대로 405"))')"); echo "  HTTP $(printf '%s' "$d" | tail -1)"; printf '%s' "$d" | sed '$d' | head -c 200; echo
