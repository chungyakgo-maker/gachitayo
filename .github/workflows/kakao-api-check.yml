# 카카오 API 확인 (일회용 점검): 디고 앱 REST API 키로 자동차 길찾기 응답 모양·진행 방향(angle)·오류 코드를 본다.
# 키 값·사용자 위치는 출력하지 않는다 (공개된 두 지점: 서울역 → 남산). 좌표 값은 찍지 않고 개수·이름만.
name: 카카오 API 확인

on:
  push:
    branches: [kakao-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 자동차 길찾기 응답 모양
        env:
          KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set +e
          k=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$k" ]; then echo "::error::KAKAO_REST_API_KEY 없음"; exit 1; fi
          cat > /tmp/show.js <<'JS'
          let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const j=JSON.parse(s);
            console.log("  최상위 열쇠:", Object.keys(j).join(","));
            const r=j.routes&&j.routes[0]; if(!r){console.log("  오류", JSON.stringify(j).slice(0,300));return;}
            console.log("  result", r.result_code, r.result_msg, "· routes", j.routes.length);
            if(r.summary) console.log("  summary 열쇠:", Object.keys(r.summary).join(","), "· 거리", r.summary.distance, "· 시간", r.summary.duration, "· origin 열쇠", Object.keys(r.summary.origin||{}).join(","));
            const secs=r.sections||[]; let roads=0,v=0,g=0; for(const x of secs){roads+=(x.roads||[]).length;g+=(x.guides||[]).length;for(const rd of x.roads||[])v+=(rd.vertexes||[]).length;}
            console.log("  sections", secs.length, "· roads", roads, "· vertexes 값", v, "· guides", g);
            if(secs[0]) console.log("  section 열쇠:", Object.keys(secs[0]).join(","));
            const rd=secs[0]&&secs[0].roads&&secs[0].roads[0]; if(rd) console.log("  road 열쇠:", Object.keys(rd).join(","), "· 첫 vertexes 값 수", rd.vertexes.length, "· 첫 값이 경도 범위?", rd.vertexes[0]>120&&rd.vertexes[0]<135);
            const gd=secs[0]&&secs[0].guides&&secs[0].guides[0]; if(gd) console.log("  guide 열쇠:", Object.keys(gd).join(","));
          }catch(e){console.log("  본문을 읽지 못함", s.slice(0,200))}})
          JS
          call() { echo "▶ $1"; d=$(curl -s -w '\n%{http_code}' -H "Authorization: KakaoAK $k" "https://apis-navi.kakaomobility.com/v1/directions?$2"); echo "  HTTP $(printf '%s' "$d" | tail -1)"; printf '%s' "$d" | sed '$d' | node /tmp/show.js; }
          call "기본" "origin=126.9707,37.5547&destination=126.9882,37.5512"
          call "진행 방향 angle=90" "origin=126.9707,37.5547,angle=90&destination=126.9882,37.5512"
          call "진행 방향 angle=270" "origin=126.9707,37.5547,angle=270&destination=126.9882,37.5512"
          call "summary=true" "origin=126.9707,37.5547&destination=126.9882,37.5512&summary=true"
          call "너무 가까움" "origin=126.9707,37.5547&destination=126.97071,37.55471"
          call "바다 한가운데" "origin=126.9707,37.5547&destination=125.5,36.0"
