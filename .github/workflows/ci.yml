# 푸시·PR마다 웹앱과 파일 게이트웨이(Worker)의 타입 검사·테스트를 하고, main이면
# 웹앱을 GitHub Pages에, Worker를 Cloudflare에 배포한다 (사양서 4장).
# 테스트가 실패하면 배포 단계는 실행되지 않는다 (needs).
name: 테스트·배포

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 연달아 올리면 이전 실행을 취소한다. 늦게 끝난 옛 커밋이 최신 배포를 덮어쓰지 않게 하기 위해서다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 타입 검사·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  worker-test:
    name: Worker 타입 검사·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: GitHub Pages 배포
    needs: [test, worker-test, deploy-worker]
    # 서버 배포가 실패하거나 건너뛰어도 웹앱은 배포한다 (그때는 폰에만 저장하는 빌드)
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.worker-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 빌드
        run: npm run build
        env:
          # 방금 배포한 서버(Worker) 주소. 서버 배포를 건너뛰었으면 Actions 변수 VITE_API_URL(있으면), 둘 다 없으면 폰에만 저장
          VITE_API_URL: ${{ needs.deploy-worker.outputs.api_url || vars.VITE_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    name: 서버(Worker·D1·R2) 배포
    needs: [test, worker-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    env:
      # Settings → Secrets and variables → Actions → Secrets 에 등록한 값 (사양서 11장). 없으면 건너뛴다
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 설정값 확인
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Cloudflare 비밀값(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)이 아직 없어 서버 배포를 건너뜁니다. 웹앱은 폰에만 저장합니다."
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE == 'true'
      - name: 비밀값 확인 (같이 붙여 넣은 군더더기는 떼고, Cloudflare에 미리 확인)
        if: env.HAS_CLOUDFLARE == 'true'
        run: bash .github/scripts/cloudflare-secrets.sh
      - uses: actions/setup-node@v7
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: 준비
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        run: npm ci
      - name: R2 버킷 (없으면 만들기)
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        run: |
          if npx wrangler r2 bucket list | grep -q 'gachitayo-sessions'; then
            echo "R2 버킷 gachitayo-sessions 있음"
          else
            npx wrangler r2 bucket create gachitayo-sessions
          fi
      - name: 선 지도 R2 버킷 (없으면 아시아 지역에 만들기, 지도 데이터는 map-data.yml이 올림)
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        run: |
          # 지도 데이터 작업(map-data.yml)이 같은 때 만들 수도 있어, 만들기가 실패해도 이미 있으면 괜찮다
          if npx wrangler r2 bucket list | grep -q 'gachitayo-map-apac'; then
            echo "R2 버킷 gachitayo-map-apac 있음"
          else
            npx wrangler r2 bucket create gachitayo-map-apac --location apac || npx wrangler r2 bucket list | grep -q 'gachitayo-map-apac'
          fi
      - name: D1 데이터베이스 (없으면 만들기)
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e "
              let s = ''; process.stdin.on('data', (d) => (s += d)).on('end', () => {
                // 경고 줄이 섞여 있어도 JSON 배열을 찾는다
                for (let i = s.indexOf('['); i >= 0; i = s.indexOf('[', i + 1)) {
                  try {
                    const list = JSON.parse(s.slice(i));
                    if (Array.isArray(list)) return process.stdout.write((list.find((d) => d.name === 'gachitayo') || {}).uuid || '');
                  } catch {}
                }
              });"
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create gachitayo
            id=$(find_id)
          fi
          if [ -z "$id" ]; then echo "::error::D1 데이터베이스 gachitayo를 찾거나 만들지 못했습니다"; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          echo "D1 gachitayo: $id"
      - name: 표 만들기·고치기 (D1 마이그레이션)
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply gachitayo --remote
      - name: Worker 배포
        id: deploy
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          npx wrangler deploy --var "ALLOWED_ORIGIN:https://${OWNER,,}.github.io" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Worker 주소(workers.dev)를 찾지 못했습니다. Cloudflare에서 workers.dev 하위 주소를 정했는지 확인해 주세요"; exit 1; fi
          echo "서버 주소: $url"
          echo "api_url=$url" >> "$GITHUB_OUTPUT"
      - name: 서버 응답 확인 (데이터는 만들지 않음)
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          origin="https://${OWNER,,}.github.io"
          check() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          # 새 주소는 퍼지는 데 몇 초 걸릴 수 있어 잠깐 기다리며 다시 묻는다
          for i in $(seq 1 12); do code=$(check -H "Origin: $origin" "$API_URL/api/me"); [ "$code" = 401 ] && break; sleep 5; done
          pre=$(check -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: PUT' "$API_URL/api/me")
          other=$(check -H 'Origin: https://example.com' "$API_URL/api/me")
          echo "열쇠 없이 내 정보: $code (401이어야 함) · 앱 주소에서 사전 요청: $pre (204) · 다른 주소: $other (403)"
          [ "$code" = 401 ] && [ "$pre" = 204 ] && [ "$other" = 403 ] || { echo "::error::서버가 예상과 다르게 응답합니다"; exit 1; }
          # 선 지도 (사양서 8.9): 지도 데이터가 올라가 있으면 정보·서울 타일·글자 조각을 확인한다
          info=$(check -H "Origin: $origin" "$API_URL/map/info")
          if [ "$info" = 200 ]; then
            tile=$(curl -s -o tile.mvt -w '%{http_code}' --max-time 20 -H "Origin: $origin" "$API_URL/map/tiles/14/13970/6344.mvt")
            font=$(check -H "Origin: $origin" "$API_URL/map/fonts/Noto%20Sans%20Medium/0-255.pbf")
            echo "선 지도: 정보 $info · 서울 타일 $tile ($(stat -c %s tile.mvt 2>/dev/null || echo 0) 바이트) · 글자 조각 $font"
            [ "$tile" = 200 ] && [ "$font" = 200 ] || { echo "::error::선 지도 응답이 이상합니다"; exit 1; }
          else
            echo "::notice::선 지도 데이터가 아직 없습니다 ($info). 지도 데이터 작업(map-data.yml)이 끝나면 앱이 선 지도를 씁니다."
          fi
