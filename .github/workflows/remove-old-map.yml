# 예전 미국 지도 버킷(gachitayo-map) 지우기, 한 번만 (사용자 요청). 끝나면 이 파일은 지운다.
name: 예전 지도 버킷 지우기

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-old-map.yml
      - .github/scripts/remove-old-map.sh

permissions:
  contents: read

jobs:
  remove:
    name: gachitayo-map 비우고 지우기
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 설정값 확인
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Cloudflare 비밀값이 없어 건너뜁니다."
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE == 'true'
      - name: 비밀값 확인
        if: env.HAS_CLOUDFLARE == 'true'
        run: bash .github/scripts/cloudflare-secrets.sh
      - name: 비우고 지우기
        if: env.HAS_CLOUDFLARE == 'true'
        run: bash .github/scripts/remove-old-map.sh
