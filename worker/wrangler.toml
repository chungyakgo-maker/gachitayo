# 같이타요 API + 파일 게이트웨이 (사양서 6.5, 6.6): 웹앱은 이 Worker만 거쳐 D1(표)과 R2(파일)에 접근한다.
# ALLOWED_ORIGIN은 배포 때 GitHub Actions가 넣고(--var), D1 database_id도 배포 때 실제 값으로 바꾼다 (.github/workflows/ci.yml).
name = "gachitayo-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "SESSION_FILES"
bucket_name = "gachitayo-sessions"

# 선 지도 (한국 지도 파일 korea.pmtiles + 글자 조각). 사용자 기록과 섞지 않으려고 따로 둔다.
# 한국에서 빨리 읽히게 아시아 지역(apac)에 둔다 (예전 gachitayo-map은 미국에 생겨 느려서 바꿨고, 2026-11-13에 지웠다)
[[r2_buckets]]
binding = "MAP"
bucket_name = "gachitayo-map-apac"

[[d1_databases]]
binding = "DB"
database_name = "gachitayo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 앞 친구 간격용 실시간 방 (M9). 무료 플랜은 SQLite 방식만 쓸 수 있다
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
